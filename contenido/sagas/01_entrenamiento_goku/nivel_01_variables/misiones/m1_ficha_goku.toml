enunciado = '''
El Maestro Roshi quiere apuntar a su nuevo alumno. Guarda los datos de Goku
en cuatro variables:

| Variable | Qué guarda | Valor |
|---|---|---|
| `nombre` | Un texto | Goku |
| `poder` | Un número entero | 9001 |
| `altura` | Un número con decimales | 1.75 |
| `es_saiyajin` | Verdadero o falso | verdadero |

Cambia cada `...` por el valor correcto.
'''

plantilla = '''
# === TU CÓDIGO ===
nombre = ...
poder = ...
altura = ...
es_saiyajin = ...
'''

pistas = [
